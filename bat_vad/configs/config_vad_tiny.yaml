audio:
  samplerate: 256000
  resample:
    enabled: True
    method: "poly"

preprocess:
  stft:
    window_duration: 0.002
    window_overlap: 0.75
    window_fn: hann
  frequencies:
    max_freq: 120000
    min_freq: 10000
  size:
    height: 64  # Reduced from 128 for smaller model
    resize_factor: 0.5
  spectrogram_transforms:
    - name: pcen
      time_constant: 0.1
      gain: 0.98
      bias: 2
      power: 0.5
    - name: spectral_mean_substraction

postprocess:
  nms_kernel_size: 9
  detection_threshold: 0.01
  top_k_per_sec: 200

model:
  input_height: 64  # Reduced for smaller model
  in_channels: 1
  out_channels: 8  # Very small - just binary VAD
  encoder:
    return_skip: false
    layers:
      - name: DepthwiseSeparableConvDown  # 1 -> 8 channels
        out_channels: 8
      - name: DepthwiseSeparableConvDown  # 8 -> 16 channels
        out_channels: 16
      - name: DepthwiseSeparableConvDown  # 16 -> 32 channels
        out_channels: 32
  bottleneck:
    channels: 32
    layers: []  # No bottleneck layers - keep it minimal
  decoder:
    use_skip: false
    layers:
      - name: DepthwiseSeparableConvTransposeUp  # 32 -> 16
        out_channels: 16
      - name: DepthwiseSeparableConvTransposeUp  # 16 -> 8
        out_channels: 8
      - name: DepthwiseSeparableConvTransposeUp  # 8 -> 8
        out_channels: 8

train:
  optimizer:
    learning_rate: 0.001
    t_max: 100

  labels:
    sigma: 3

  trainer:
    max_epochs: 150
    check_val_every_n_epoch: 5
    logger:
      - name: csv

  train_loader:
    batch_size: 16  # Larger batch size for tiny model
    num_workers: 2

  val_loader:
    batch_size: 16

audio:
  samplerate: 256000
  resample:
    enabled: True
    method: "poly"

preprocess:
  stft:
    window_duration: 0.002
    window_overlap: 0.75
    window_fn: hann
  frequencies:
    max_freq: 120000
    min_freq: 10000
  size:
    height: 128
    resize_factor: 0.5
  spectrogram_transforms:
    - name: pcen
      time_constant: 0.1
      gain: 0.98
      bias: 2
      power: 0.5
    - name: spectral_mean_substraction

postprocess:
  nms_kernel_size: 9
  detection_threshold: 0.01
  top_k_per_sec: 200

model:
  input_height: 128
  in_channels: 1
  out_channels: 16
  encoder:
    return_skip: false
    layers:
      - name: DepthwiseSeparableConvDown
        out_channels: 16
      - name: DepthwiseSeparableConvDown
        out_channels: 32
      - name: LayerGroup
        layers:
          - name: DepthwiseSeparableConvDown
            out_channels: 64
          - name: DepthwiseSeparableConv
            out_channels: 128
  bottleneck:
    channels: 128
    layers: []  # Empty bottleneck - no attention
  decoder:
    use_skip: false
    layers:
      - name: DepthwiseSeparableConvTransposeUp
        out_channels: 32
      - name: DepthwiseSeparableConvTransposeUp
        out_channels: 16
      - name: LayerGroup
        layers:
          - name: DepthwiseSeparableConvTransposeUp
            out_channels: 16
          - name: DepthwiseSeparableConv
            out_channels: 16

train:
  optimizer:
    learning_rate: 0.001
    t_max: 100

  labels:
    sigma: 3

  trainer:
    max_epochs: 200
    check_val_every_n_epoch: 5

  train_loader:
    batch_size: 8

    num_workers: 2

  val_loader:
    batch_size: 16
    num_workers: 2

  test_loader:
    batch_size: 16
    num_workers: 2

  checkpoint:
    save_top_k: 3
    monitor: "val/loss"
    mode: "min"
    filename: "epoch={epoch:03d}-step={step:06d}"

augmentations: []

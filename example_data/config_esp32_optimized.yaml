audio:
  samplerate: 256000
  resample:
    enabled: True
    method: "poly"

preprocess:
  stft:
    window_duration: 0.002
    window_overlap: 0.75
    window_fn: hann
  frequencies:
    max_freq: 120000
    min_freq: 10000
  size:
    height: 128
    resize_factor: 0.5
  spectrogram_transforms:
    - name: pcen
      time_constant: 0.1
      gain: 0.98
      bias: 2
      power: 0.5
    - name: spectral_mean_substraction

postprocess:
  nms_kernel_size: 9
  detection_threshold: 0.01
  top_k_per_sec: 200

model:
  input_height: 128
  in_channels: 1
  out_channels: 16
  encoder:
    return_skip: false
    layers:
      - name: FreqCoordConvDownBroadcast
        out_channels: 16
      - name: FreqCoordConvDownBroadcast
        out_channels: 32
      - name: LayerGroup
        layers:
          - name: FreqCoordConvDownBroadcast
            out_channels: 64
          - name: ConvBlock
            out_channels: 128
  bottleneck:
    channels: 128
    layers: []  # Empty bottleneck - no attention, just 1x1 conv
  decoder:
    use_skip: false
    layers:
      - name: FreqCoordConvUpBroadcast
        out_channels: 32
      - name: FreqCoordConvUpBroadcast
        out_channels: 16
      - name: LayerGroup
        layers:
          - name: FreqCoordConvUpBroadcast
            out_channels: 16
          - name: ConvBlock
            out_channels: 16

train:
  optimizer:
    learning_rate: 0.001
    t_max: 100
  logger:
    name: csv
  labels:
    sigma: 3

  trainer:
    max_epochs: 200
    check_val_every_n_epoch: 5

  train_loader:
    batch_size: 8

    num_workers: 2

    shuffle: True

    clipping_strategy:
      name: random_subclip
      duration: 0.256

    augmentations:
      enabled: true
      audio:
        - name: mix_audio
          probability: 0.2
          min_weight: 0.3
          max_weight: 0.7

  val_loader:
    batch_size: 8
    num_workers: 2
    shuffle: False

    clipping_strategy:
      name: random_subclip
      duration: 0.256

dataset:
  audio_dir: "/mnt/d/Acoustics/Bat Detector Datasets/SouthernUK_10SpeciesDataset_20190430/0. data/train/audio"
  annotations_file: "/mnt/d/Acoustics/Bat Detector Datasets/SouthernUK_10SpeciesDataset_20190430/0. data/train/anns/train_anns.json"
  split: "train"

eval_dataset:
  audio_dir: "/mnt/d/Acoustics/Bat Detector Datasets/SouthernUK_10SpeciesDataset_20190430/0. data/val/audio"
  annotations_file: "/mnt/d/Acoustics/Bat Detector Datasets/SouthernUK_10SpeciesDataset_20190430/0. data/val/anns/val_anns.json"
  split: "val"

targets:
  class_names:
    - Barbastella barbastellus
    - Eptesicus serotinus
    - Myotis alcathoe
    - Myotis bechsteinii
    - Myotis brandtii
    - Myotis daubentonii
    - Myotis mystacinus
    - Myotis nattereri
    - Nyctalus leisleri
    - Nyctalus noctula
    - Pipistrellus nathusii
    - Pipistrellus pipistrellus
    - Pipistrellus pygmaeus
    - Plecotus auritus
    - Plecotus austriacus
    - Rhinolophus ferrumequinum
    - Rhinolophus hipposideros

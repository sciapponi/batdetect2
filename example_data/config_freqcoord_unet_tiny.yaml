# Tiny U-Net using FreqCoordConv instead of PhiNet
# Based on original architecture but with reduced channels

audio:
  samplerate: 256000
  resample:
    enabled: True
    method: "poly"

preprocess:
  stft:
    window_duration: 0.002
    window_overlap: 0.75
    window_fn: hann
  frequencies:
    max_freq: 120000
    min_freq: 10000
  size:
    height: 128
    resize_factor: 0.5
  spectrogram_transforms:
    - name: pcen
      time_constant: 0.1
      gain: 0.98
      bias: 2
      power: 0.5
    - name: spectral_mean_substraction

postprocess:
  nms_kernel_size: 9
  detection_threshold: 0.01
  top_k_per_sec: 200

model:
  input_height: 128
  in_channels: 1
  out_channels: 32
  encoder:
    return_skip: true
    layers:
      - name: FreqCoordConvDown
        out_channels: 24
      - name: FreqCoordConvDown
        out_channels: 48
      - name: FreqCoordConvDown
        out_channels: 96
      - name: FreqCoordConvDown
        out_channels: 192
  bottleneck:
    channels: 192
    layers:
      - name: LiteMLA
        out_channels: 192
        dim_qk: 16
        dim_v: 32
        expansion_ratio: 2.0
        beta: 1.0
  decoder:
    use_skip: true
    layers:
      - name: FreqCoordConvUp
        out_channels: 96
      - name: FreqCoordConvUp
        out_channels: 48
      - name: FreqCoordConvUp
        out_channels: 24
      - name: LayerGroup
        layers:
          - name: FreqCoordConvUp
            out_channels: 32
          - name: ConvBlock
            out_channels: 32

train:
  optimizer:
    learning_rate: 0.0001
    t_max: 100

  labels:
    sigma: 3

  trainer:
    max_epochs: 400
    check_val_every_n_epoch: 5
    gradient_clip_val: 1.0
    accumulate_grad_batches: 4

  train_loader:
    batch_size: 8
    num_workers: 2
    shuffle: True
    clipping_strategy:
      name: random_subclip
      duration: 0.256
    augmentations:
      enabled: true
      audio:
        - name: mix_audio
          probability: 0.1
          min_weight: 0.4
          max_weight: 0.6
      spectrogram:
        - name: mask_freq
          probability: 0.1
          max_width: 5
        - name: mask_time
          probability: 0.1
          max_width: 10

  val_loader:
    batch_size: 8
    num_workers: 2
    shuffle: False
    clipping_strategy:
      name: random_subclip
      duration: 0.256
    augmentations:
      enabled: false

  callbacks:
    early_stopping:
      monitor: val_loss
      patience: 20
      mode: min
    model_checkpoint:
      monitor: val_loss
      mode: min
      save_top_k: 3
      dirpath: outputs/checkpoints
      filename: "epoch={epoch}-step={step}"

  logger:
    name: csv

# Tiny U-Net with PhiNet blocks and LiteMLA attention
# Significantly smaller than standard models for on-device deployment

audio:
  samplerate: 256000
  resample:
    enabled: True
    method: "poly"

preprocess:
  stft:
    window_duration: 0.002
    window_overlap: 0.75
    window_fn: hann
  frequencies:
    max_freq: 120000
    min_freq: 10000
  size:
    height: 128
    resize_factor: 0.5
  spectrogram_transforms:
    - name: pcen
      time_constant: 0.1
      gain: 0.98
      bias: 2
      power: 0.5
    - name: spectral_mean_substraction

postprocess:
  nms_kernel_size: 9
  detection_threshold: 0.01
  top_k_per_sec: 200

model:
  input_height: 128
  in_channels: 1
  out_channels: 32
  encoder:
    return_skip: true  # U-Net style with skip connections
    layers:
      # All 4 layers downsample with stride=2 for symmetric U-Net
      - name: PhiNetConvBlock
        out_channels: 24
        expanded_channels: 72  # 3x expansion
        stride: 2
      - name: PhiNetConvBlock
        out_channels: 48
        expanded_channels: 144
        stride: 2
      - name: PhiNetConvBlock
        out_channels: 96
        expanded_channels: 288
        stride: 2
      - name: PhiNetConvBlock
        out_channels: 192
        expanded_channels: 576
        stride: 2
  bottleneck:
    channels: 192
    layers:
      # Lightweight linear attention
      - name: LiteMLA
        out_channels: 192
        dim_qk: 16
        dim_v: 32
        expansion_ratio: 2.0  # Smaller than default 3.0
        beta: 1.0
  decoder:
    use_skip: true  # U-Net style with skip connections
    layers:
      # Decoder processes residuals in reverse: [128, 64, 32, 16]
      # All layers upsample to match encoder downsampling pattern
      # Layer 0: receives bottleneck output (192) + residual[3] (192), upsample
      - name: LayerGroup
        layers:
          - name: StandardConvUp
            out_channels: 96
          - name: PhiNetConvBlock
            out_channels: 96
            expanded_channels: 288
            stride: 1
      # Layer 1: receives residual[2] (96), upsample
      - name: LayerGroup
        layers:
          - name: StandardConvUp
            out_channels: 48
          - name: PhiNetConvBlock
            out_channels: 48
            expanded_channels: 144
            stride: 1
      # Layer 2: receives residual[1] (48), upsample
      - name: LayerGroup
        layers:
          - name: StandardConvUp
            out_channels: 24
          - name: PhiNetConvBlock
            out_channels: 24
            expanded_channels: 72
            stride: 1
      # Layer 3: receives residual[0] (24), upsample back to original size
      - name: LayerGroup
        layers:
          - name: StandardConvUp
            out_channels: 32  # Final output channels for heads
          - name: PhiNetConvBlock
            out_channels: 32
            expanded_channels: 96
            stride: 1

train:
  optimizer:
    learning_rate: 0.0003
    t_max: 100

  labels:
    sigma: 3

  trainer:
    max_epochs: 400
    check_val_every_n_epoch: 5
    gradient_clip_val: 1.0
    accumulate_grad_batches: 4

  train_loader:
    batch_size: 8
    num_workers: 2
    shuffle: True
    clipping_strategy:
      name: random_subclip
      duration: 0.256
    augmentations:
      enabled: true
      audio:
        - name: mix_audio
          probability: 0.1
          min_weight: 0.4
          max_weight: 0.6
      spectrogram:
        - name: mask_freq
          probability: 0.1
          max_width: 5
        - name: mask_time
          probability: 0.1
          max_width: 10

  val_loader:
    batch_size: 8
    num_workers: 2
    shuffle: False
    clipping_strategy:
      name: random_subclip
      duration: 0.256
    augmentations:
      enabled: false

  callbacks:
    early_stopping:
      monitor: val_loss
      patience: 20
      mode: min
    model_checkpoint:
      monitor: val_loss
      mode: min
      save_top_k: 3
      dirpath: outputs/checkpoints
      filename: "epoch={epoch}-step={step}"

  logger:
    name: csv
